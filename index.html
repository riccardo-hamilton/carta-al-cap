*{box-sizing:border-box;min-width:0}
body{margin:0;min-height:100vh;background:radial-gradient(120% 80% at 50% 30%,var(--felt),var(--felt2));color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:760px;margin:0 auto;padding:16px max(4vw,14px) 48px}

p{margin:6px 0}.mut{color:var(--mut)}.small{font-size:14px}

button:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.pri{background:var(--card);color:var(--cink);border-color:transparent}
button:disabled{opacity:.45;cursor:default}
select{font:16px Inter;min-height:44px;border-radius:10px;padding:0 10px;background:var(--card);color:var(--cink);border:0}
.panel{background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sp{justify-content:space-between}
.list{display:grid;gap:8px;margin-top:8px}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.07)}

.slot span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px}

.hand .card{width:72px;height:101px}
.hand{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.hand .card.play{cursor:pointer;transition:transform .15s}

table{width:100%;border-collapse:collapse;font-size:15px}

.scroll{overflow-x:auto}

.quick{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.quick button{flex:none;min-height:38px;padding:0 12px;border-radius:99px;font-size:14px;font-weight:600;background:rgba(255,255,255,.12)}
@keyframes deal{from{opacity:0;transform:translate(-40px,-120px) rotate(-25deg) scale(.6)}to{opacity:1;transform:none}}
@keyframes flyU{from{opacity:0;transform:translateY(90px) rotate(10deg) scale(.85)}to{opacity:1;transform:none}}
@keyframes flyD{from{opacity:0;transform:translateY(-90px) rotate(-10deg) scale(.85)}to{opacity:1;transform:none}}
@keyframes collect{0%{transform:none;opacity:1}100%{transform:translateY(-30px) scale(.7);opacity:0}}
@keyframes flip{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,91,.55)}50%{box-shadow:0 0 0 7px rgba(255,107,91,0)}}
@keyframes rowin{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.card.deal{animation:deal .45s cubic-bezier(.2,.8,.3,1) both}
.card.fly-up{animation:flyU .38s cubic-bezier(.2,.8,.3,1) both}
.card.fly-down{animation:flyD .38s cubic-bezier(.2,.8,.3,1) both}
.trick.collect{animation:collect .7s ease-in both}
.card.flip{animation:flip .6s ease-out both}
.card.winc{box-shadow:0 0 0 3px var(--acc),0 6px 14px rgba(0,0,0,.35)}
.pl.turn{animation:pulse 1.6s ease-in-out infinite}
tr.rowin{animation:rowin .4s ease-out both}
@media(prefers-reduced-motion:reduce){.card,.trick,.pl,tr{animation:none!important}}
.err{background:#5e1e1e;border-radius:12px;padding:10px 14px;margin:10px 0}
@media(max-width:600px){.card{width:56px;height:79px}.hand .card{width:62px;height:87px}.players{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){.hand .card.play{transition:none}}

function newDeck(){const d=[];for(const s of 'HDCS')for(let r=2;r<=14;r++)d.push(r+s);for(let i=d.length-1;i>0;i--){const j=rnd(i+1);[d[i],d[j]]=[d[j],d[i]]}return d}

}

}

    for(const id of g.players){const b=mv[id]&&mv[id].bid;if(b&&b.h===g.h&&(b.r||0)===(g.r||0)&&g.bids[id]==null&&Number.isInteger(b.v)&&b.v>=0&&b.v<=k)g.bids[id]=b.v}

}

function publicOf(g){const p=clone(g);delete p.hands;p.handCount={};for(const id of g.players||[])p.handCount[id]=g.hands&&g.hands[id]?g.hands[id].length:0;return p}

  }
  if(!inGame&&G.status!=='end')handH=`<p class="note">Stai guardando la partita: le carte dei giocatori restano nascoste.</p>`;
  const hist=G.history&&G.history.length?`<details class="panel"><summary>Punteggio mano per mano</summary><div class="scroll"><table><thead><tr><th>Mano</th>${P.map(id=>`<th>${esc(nm(id))}</th>`).join('')}</tr></thead><tbody>${G.history.map((r,i)=>`<tr><td>${i+1} (${r.c})</td>${P.map(id=>{const x=r.rows[id];return `<td class="${x.pt>0?'pos':x.pt<0?'neg':''}">${x.b}/${x.t} ${sign(x.pt)}</td>`}).join('')}</tr>`).join('')}<tr><td><b>Totale</b></td>${P.map(id=>`<td><b>${G.scores[id]}</b></td>`).join('')}</tr></tbody></table></div><p class="note">Ogni cella: dichiarate/fatte e punti.</p></details>`:'';
  const take=inGame&&!host&&G.status!=='end'?`<details class="note"><summary>La partita è ferma?</summary><p>La partita avanza solo mentre l'host ha la pagina aperta. Se l'host è uscito, puoi prendere il suo posto.</p><button data-act="takeover">Diventa host</button></details>`:'';
  return top+bar+pls+orderH()+`<div class="table">${center}</div>`+handH+hist+take;
}

function render(){
  const ae=document.activeElement,fid=ae&&ae.id;
  let h='';
  if(!me)h=`<h1>Carta al Cap</h1><p class="mut">${loading?'Collegamento…':'Non riesco a collegarmi. Controlla la connessione e ricarica.'}</p>`;
  else if(!myName)h=viewName();
  else h=gid?viewGame():viewLobby();
  if(msg)h=`<div class="err" role="alert">${esc(msg)}</div>`+h;
  app.innerHTML=h;
  chatwrap.hidden=!gid||!G;
  if(fid){const el=document.getElementById(fid);if(el)el.focus()}
}

app.addEventListener('submit',e=>{e.preventDefault();app.querySelector('[data-act=name]').click()});
app.addEventListener('change',e=>{if(e.target.id==='mx'){maxSel=parseInt(e.target.value,10);render()}});
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act;msg='';
  if(a==='name'){const v=(document.getElementById('nick').value||'').trim().slice(0,20);if(!v){msg='Scrivi un nome.';return render()}myName=v;LS.set('cac-name',v);return render()}
  if(a==='rename'){myName='';return render()}
  if(a==='del'){const id=b.dataset.id;if(confirmDel!==id){confirmDel=id;render();setTimeout(()=>{if(confirmDel===id){confirmDel=null;render()}},4000);return}
    confirmDel=null;if(gid===id)openGame(null);deleteDoc(doc(fs,'games',id)).catch(fail('Non riesco a eliminare la partita.'));return}
  if(a==='sound'){soundOn=!soundOn;LS.set('cac-sound',soundOn?'1':'0');ac();render();if(soundOn)setTimeout(()=>sfx('play'),50);return}
  if(a==='chat'){document.getElementById('chatbox').scrollIntoView({behavior:'smooth'});setTimeout(()=>chatin.focus({preventScroll:true}),400);return}
  if(a==='new')return newGame();
  if(a==='open')return openGame(b.dataset.id);
  if(a==='back')return openGame(null);
  if(a==='join')return writeMove({join:true});
  if(a==='leave'){writeMove({join:false});return openGame(null)}
  if(a==='bid')return writeMove({join:true,bid:{r:G.r,h:G.h,v:parseInt(b.dataset.v,10)}});
  if(a==='play')return writeMove({join:true,play:{r:G.r,h:G.h,t:G.trickNo,c:b.dataset.c}});
  if(!G)return;
  if(a==='start'&&G.host===me){const mx=maxFor(G.players.length);return saveG(start(full(),Math.min(maxSel||mx,mx)),true)}
  if(a==='next'&&G.host===me)return saveG(deal(full(),G.h+1),true);
  if(a==='again'&&G.host===me)return saveG(start(full(),(G.seq.length+1)/2),true);
  if(a==='takeover'){updateDoc(doc(fs,'games',gid),{host:me}).catch(fail('Non riesco a prendere il controllo.'));return}
  
});


function viewName(){return `<h1>Carta al Cap</h1><p class="mut">Scommetti su quante prese farai. Asso alto, i semi non contano, a parità vince chi ha giocato prima.</p>
<form class="panel"><h2>Come ti chiami?</h2><p class="small mut">Il nome che vedranno gli altri al tavolo.</p><div class="row"><input id="nick" maxlength="20" autocomplete="nickname" value="${esc(myName)}" style="font:16px Inter;min-height:44px;border-radius:10px;border:0;padding:0 12px;flex:1 1 180px"><button class="pri" type="button" data-act="name">Entra</button></div></form>${rulesH()}`}

onAuthStateChanged(auth,u=>{
  if(!u){signInAnonymously(auth).catch(e=>{console.error(e);loading=false;msg='Accesso anonimo non riuscito ['+(e&&e.code)+']';render()});return}
  me=u.uid;loading=false;
  if(!gamesUnsub)gamesUnsub=onSnapshot(query(collection(fs,'games'),orderBy('created','desc'),limit(40)),s=>{games=s.docs.map(d=>Object.assign({id:d.id},d.data()));if(!gid)render()},fail('Non riesco a leggere le partite: controlla le regole di Firestore.'));
  const h=(location.hash||'').slice(1);
  if(/^g[a-z0-9]+$/.test(h)&&!gid)openGame(h);else render();
});
setTimeout(()=>{if(!me){loading=false;render()}},10000);
render();
</script></body></html>
